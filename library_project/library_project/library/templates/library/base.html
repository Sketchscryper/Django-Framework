<!-- library/templates/library/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Библиотека{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'library:home' %}">📚 Библиотека</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'library:book_list' %}">Книги</a>
                <a class="nav-link" href="{% url 'library:author_list' %}">Авторы</a>
                <a class="nav-link" href="{% url 'library:reader_list' %}">Читатели</a>

                {% if user.is_authenticated %}
                    <span class="navbar-text text-light me-2">Привет, {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'library:logout' %}">Выйти</a>
                {% else %}
                    <a class="nav-link" href="{% url 'library:login' %}">Войти</a>
                    <a class="nav-link" href="{% url 'library:register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
