{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Удалить статью?</h2>
    <p>Вы уверены, что хотите удалить "<strong>{{ article.title }}</strong>"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'article_detail' article.id %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
